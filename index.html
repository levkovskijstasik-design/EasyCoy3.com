<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Easy Союз</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Устанавливаем картинку на весь фон */
            background: url('image.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        /* Затемняющий слой, чтобы текст было видно на фоне картинки */
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .btn {
            display: inline-block;
            background: #d43f3f;
            padding: 20px 50px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff4d4d;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>EASY СОЮЗ</h1>
        <a href="https://www.youtube.com/@EasyCoy3/shorts" target="_blank" class="btn">ВСТУПИТЬ</a>
    </div>
</body>
</html>
