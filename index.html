<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Радуга сверху вниз */
            background: linear-gradient(180deg, red, orange, yellow, green, blue, purple);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .overlay {
            /* Убрали затемнение, чтобы радуга была видна */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .btn {
            display: inline-block;
            background: #d43f3f;
            padding: 20px 50px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff4d4d;
            transform: scale(1.1);
        }
    </style>
