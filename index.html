<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВКонтакте | Изи Союз</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .bg { width: 100vw; height: 100vh; object-fit: contain; display: block; }
        .trigger { position: fixed; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        #sc { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
        #sc img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img src="page.png" class="bg">
    <div class="trigger" onclick="boom()"></div>

    <div id="sc">
        <img src="scrim.jpg">
        <audio id="au" src="scream.mp3"></audio>
    </div>

    <script>
        function boom() {
            const s = document.getElementById('sc');
            const a = document.getElementById('au');
            s.style.display = 'block';
            a.play();
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }
    </script>
</body>
</html>
