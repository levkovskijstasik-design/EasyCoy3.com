<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Easy Союз</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, red, orange, yellow, green, blue, purple);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .overlay {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
        }
        .btn {
            display: inline-block;
            background: #d43f3f;
            padding: 20px 50px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff4d4d;
            transform: scale(1.1);
        }
        .footer-text {
            padding-bottom: 20px;
            font-size: 1.2rem;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>EASY СОЮЗ</h1>
        <a href="https://www.youtube.com/@EasyCoy3/videos" target="_blank" class="btn">ВСТУПИТЬ</a>
    </div>
    <div class="footer-text">
        Воссоединённые каналы не всегда нормальные но и не всегда плохие
    </div>
</body>
</html>
